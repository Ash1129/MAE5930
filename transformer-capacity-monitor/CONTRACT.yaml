# CONTRACT.yaml - the task ledger for the Transformer Capacity Monitor.
# SPEC.md says what the tool IS. This file says what is being DONE.
# Adapted from the hackathon template in "Timmy's stuff/CONTRACT.yaml". The eight tasks map to the
# 100-point rubric (Timmy's stuff/docs/criteria.md). Where this app's layout differs from the template
# (no app/ folder, statistics in capacity_monitor/pipeline.py), the definition_of_done says so.
#
# Rules: one task in_progress per person; check out (status, owner, started_at) before work; check in
# (status done + one-line result) in the same commit as the work; definition_of_done is a runnable check
# whose output is quoted in result. Quote any string that contains a colon. No tabs.
# Check it parses:  python -c "import yaml; yaml.safe_load(open('CONTRACT.yaml'))"

spec: SPEC.md
