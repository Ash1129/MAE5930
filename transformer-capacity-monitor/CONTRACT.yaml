    points: "10 - Tool Documentation: 2-3 working test datasets (5), codebook and README for the data (5)"
    status: done
    owner: "Claude"
    started_at: "2026-10-16 18:20"
    owns: ["data/README.md", "scripts/run_demo.py"]
    definition_of_done: >
      data/README.md names every feed file and describes every column with units, how the tool uses
      it, and how it would be collected for real; scripts/run_demo.py runs on each of the three
      datasets (normal, boundary-mismatch, missing-rating). Deviation from the template, which asks
      for ls data/*.csv to list 2-3 files - each dataset here is four feed files from a seeded generator.
    result: >
      data/README.md written (4 files, every column, units, rules applied, real collection method,
      planted-case table). run_demo.py printed "12 transformers - 7 within limits, 5 need review"
      for normal, and "failed, stopped at step 7" with the expected blocking problem for the other two.

  - id: H-03
    title: Core QC statistics as plain, tested functions
    points: "25 - Tool Implementation: valid analyses relevant to quality control in R or Python"
    status: done
    owner: "App Six Sigma session"
    started_at: "2026-10-16 18:15"
    owns: ["capacity_monitor/pipeline.py", "tests/"]
    definition_of_done: >
      .venv/bin/python -m pytest tests -q passes, including known-answer tests (I-MR limits, Cpk,
      hand-computed Bissell interval, forecast with unit conversion) and degenerate cases (constant
      data, n = 1, empty, non-finite). Deviation - the statistics are in capacity_monitor/pipeline.py,
      not app/qc.py.
    result: "pytest tests -q printed '24 passed in 3.75s' on 2026-10-16."

