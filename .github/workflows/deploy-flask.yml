# Deploy the Flask review app to Posit Connect.
# Adapted from the course FastAPI workflow (timothyfraser/fastapi-connect-demo, MIT).
# Flask is a WSGI app, so the manifest appmode is python-api.
#
# REPO SECRETS: CONNECT_SERVER, CONNECT_API_KEY. Never commit them.
name: Deploy Flask to Posit Connect

on:
  push:
    branches: [main]
    paths:
      - 'transformer-capacity-monitor/**'
      - '.github/workflows/deploy-flask.yml'
      - '.github/scripts/connect-publish-async.sh'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-flask
  cancel-in-progress: false

env:
  APP_DIR: transformer-capacity-monitor
  CONTENT_NAME: ${{ github.repository_owner }}-${{ github.event.repository.name }}-monitor
  CONTENT_TITLE: Transformer Capacity Monitor
  CONTENT_GUID: 47dc2fbc-e6a2-4347-9ee8-0df3b67fa236
  HEALTH_PATH: '/health'

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check the committed manifest (never regenerated here)
        working-directory: ${{ env.APP_DIR }}
        run: |
          set -euo pipefail
          test -f manifest.json    || { echo "::error::No manifest.json in ${APP_DIR}. On your machine run manifestme.sh, then commit it."; exit 1; }
          test -f requirements.txt || { echo "::error::No requirements.txt in ${APP_DIR}."; exit 1; }
          test -f .python-version  || { echo "::error::No .python-version in ${APP_DIR}."; exit 1; }
          MODE=$(jq -r '.metadata.appmode' manifest.json)
          ENTRY=$(jq -r '.metadata.entrypoint // ""' manifest.json)
          MPY=$(jq -r '.python.version // ""' manifest.json)
          WANT=$(tr -d ' \r\n' < .python-version)
          echo "manifest: appmode=${MODE} entrypoint=${ENTRY} python=${MPY} (.python-version=${WANT})"
          [ "$MODE" = "python-api" ] || { echo "::error::manifest appmode is '${MODE}', expected python-api."; exit 1; }
          [ "$ENTRY" = "app:app" ] || { echo "::error::manifest entrypoint is '${ENTRY}', expected app:app."; exit 1; }
          case "$MPY" in
            "$WANT"|"$WANT".*) ;;
            *) echo "::error::manifest says Python ${MPY} but .python-version says ${WANT}."; exit 1 ;;
          esac
          if grep -q $'\r' manifest.json; then
            echo "::error::manifest.json has Windows line endings."
            exit 1
          fi
          echo "ENTRY=${ENTRY}" >> "$GITHUB_ENV"

      - name: Set up Python (version from .python-version)
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version-file: ${{ env.APP_DIR }}/.python-version
          cache: pip
          cache-dependency-path: ${{ env.APP_DIR }}/requirements.txt

      - name: Smoke test -- install requirements and import the app
        working-directory: ${{ env.APP_DIR }}
        run: |
          set -euo pipefail
          python -X utf8 -m pip install -r requirements.txt
          python -X utf8 -c "import importlib, sys; m, o = sys.argv[1].split(':'); getattr(importlib.import_module(m), o); print('imported', sys.argv[1])" "$ENTRY"

      - name: Check the two repo secrets exist
        env:
          CONNECT_SERVER: ${{ secrets.CONNECT_SERVER }}
          CONNECT_API_KEY: ${{ secrets.CONNECT_API_KEY }}
        run: |
          [ -n "$CONNECT_SERVER" ]  || { echo "::error::Repo secret CONNECT_SERVER is not set."; exit 1; }
          [ -n "$CONNECT_API_KEY" ] || { echo "::error::Repo secret CONNECT_API_KEY is not set."; exit 1; }
          echo "Both secrets are present."

      - name: Publish to Posit Connect
        id: publish
        timeout-minutes: 10
        env:
          CONNECT_SERVER: ${{ secrets.CONNECT_SERVER }}
          CONNECT_API_KEY: ${{ secrets.CONNECT_API_KEY }}
          BUNDLE_DIR: ${{ env.APP_DIR }}
          CONTENT_GUID: ${{ env.CONTENT_GUID }}
          POLL_BUDGET_SECONDS: '180'
        run: bash .github/scripts/connect-publish-async.sh

      - name: Check the app answers (green is not live)
        env:
          CONNECT_API_KEY: ${{ secrets.CONNECT_API_KEY }}
          CONTENT_URL: ${{ steps.publish.outputs.content_url }}
        run: |
          set -euo pipefail
          URL="${CONTENT_URL%/}${HEALTH_PATH}"
          echo "Checking ${URL}"
          for i in $(seq 1 20); do
            CODE=$(curl -sS -L -o /dev/null -w '%{http_code}' -H "Authorization: Key ${CONNECT_API_KEY}" "$URL" || echo 000)
            echo "  attempt ${i}: HTTP ${CODE}"
            if [ "$CODE" = "200" ]; then echo "LIVE: ${URL}"; exit 0; fi
            sleep 15
          done
          echo "::error::${HEALTH_PATH} never answered 200. Open the app's Logs tab in Connect."
          exit 1
